name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end guest journey
        run: |
          npx playwright install --with-deps chromium
          AUTO_ADVANCE_SECONDS=4 AUTO_ADVANCE_TICK_SECONDS=1 DATABASE_PATH=/tmp/e2e.sqlite npm start &
          npx --yes wait-on http://localhost:3000/api/health
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots
