name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci when a lockfile is committed, otherwise a plain install.
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end guest journey
        run: |
          npx playwright install --with-deps chromium
          AUTO_ADVANCE_SECONDS=4 AUTO_ADVANCE_TICK_SECONDS=1 RATE_LIMIT_PER_MINUTE=1000 DATABASE_PATH=/tmp/e2e.sqlite npm start &
          npx --yes wait-on@8 -t 60000 http://localhost:3000/api/health
          npm run e2e
          npm run e2e:responsive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t white-label-hms:ci .
