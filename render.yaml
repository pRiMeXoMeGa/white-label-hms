# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# The free plan has no persistent disk, so the demo database re-seeds whenever the service
# restarts. For data that survives restarts, switch to a paid plan and uncomment the disk.
services:
  - type: web
    name: white-label-hms
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_ADVANCE_SECONDS
        value: "45"
      - key: AUTO_ADVANCE_SECONDS_FOOD
        value: "60"
      - key: AUTO_ADVANCE_SECONDS_LAUNDRY
        value: "90"
      - key: EARLY_CHECKIN_DAYS
        value: "0"
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
