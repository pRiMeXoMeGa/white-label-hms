# Render Blueprint for the demo service (created through Render's New > Blueprint flow).
# The free plan has no persistent disk, so the demo database re-seeds whenever the service
# restarts. The disk block below is for a paid plan, where data survives restarts.
services:
  - type: web
    name: white-label-hms
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Every request moves to its next status after 10 seconds.
      - key: AUTO_ADVANCE_SECONDS
        value: "10"
      - key: AUTO_ADVANCE_SECONDS_FOOD
        value: "10"
      - key: AUTO_ADVANCE_SECONDS_LAUNDRY
        value: "10"
      # Check for due requests every 2 s so a 10 s timer is never late by more than 2 s.
      - key: AUTO_ADVANCE_TICK_SECONDS
        value: "2"
      - key: EARLY_CHECKIN_DAYS
        value: "0"
